<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ясно — схемы бизнес-процессов за несколько минут. Шаблоны, узкие места, точки автоматизации и экспорт."
    />
    <meta name="theme-color" content="#f3efe6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Ясно — процессы на схеме</title>
    <script>
      try {
        var theme = localStorage.getItem('yasno.theme')
        if (!theme) {
          var raw = localStorage.getItem('yasno.v1')
          theme = raw ? JSON.parse(raw).theme : 'system'
        }
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#12110e' : '#f3efe6')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
